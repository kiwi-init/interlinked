name: Interlinked
configs:
  Debug: debug
  Release: release
  TestFlight: release
options:
  bundleIdPrefix: computer.interlinked
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  xcodeVersion: "16.0"
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Interlinked:
    type: application
    platform: macOS
    category: public.app-category.productivity
    sources:
      - path: Interlinked
    info:
      path: Interlinked/Info.plist
      properties:
        CFBundleDisplayName: Interlinked
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: computer.interlinked.web-url
            CFBundleURLSchemes:
              - http
              - https
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSCameraUsageDescription: Interlinked lets websites use the camera only after you approve their request.
        NSBluetoothAlwaysUsageDescription: Interlinked lets websites use nearby Bluetooth devices only after you approve their request.
        NSHumanReadableCopyright: Copyright © 2026 Jonatas Walker. All rights reserved.
        NSMicrophoneUsageDescription: Interlinked uses the microphone for voice navigation and for websites you authorize.
        NSLocationWhenInUseUsageDescription: Interlinked lets websites use your location only after you approve their request.
        NSSpeechRecognitionUsageDescription: Interlinked uses on-device speech recognition for voice navigation and browser commands.
        InterlinkedJevRelayURL: "$(INTERLINKED_JEV_RELAY_URL)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.interlinked
        PRODUCT_NAME: Interlinked
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 57249C654W
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Interlinked/Info.plist
        CODE_SIGN_ENTITLEMENTS: Interlinked/Interlinked.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build/cef/cef_binary_152.0.8+g1ce985c+chromium-152.0.7977.134_macosarm64_minimal $(SRCROOT)/blocker"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build/cef/cef-project-out/libcef_dll_wrapper $(SRCROOT)/blocker/target/release"
        OTHER_LDFLAGS: "$(inherited) -lcef_dll_wrapper -linterlinked_blocker -framework Cocoa -framework IOSurface"
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        SWIFT_OBJC_BRIDGING_HEADER: Interlinked/Chromium/Interlinked-Bridging-Header.h
        ENABLE_TESTABILITY: YES
        DEFINES_MODULE: YES
        ENABLE_DEBUG_DYLIB: NO
        INTERLINKED_JEV_RELAY_URL: ""
      configs:
        TestFlight:
          CODE_SIGN_ENTITLEMENTS: Interlinked/InterlinkedTestFlight.entitlements
          ENABLE_APP_SANDBOX: YES
          INTERLINKED_JEV_RELAY_URL: "https://interlinked-jev.187-77-224-188.sslip.io/v1/jev"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TESTFLIGHT"
    preBuildScripts:
      - name: Build Content Blocker
        script: '"$SRCROOT/script/build-blocker"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Stage Chromium Runtime
        script: '"$SRCROOT/script/stage-chromium"'
        basedOnDependencyAnalysis: false
  interlinked-ctl:
    type: tool
    platform: macOS
    sources:
      - path: InterlinkedControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.interlinked.cli
        PRODUCT_NAME: interlinked
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_FORCE_DYNAMIC_LINK_STDLIB: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  InterlinkedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: InterlinkedTests
      - path: Interlinked/Model
      - path: Interlinked/App/Intent.swift
      - path: Interlinked/App/PageTextBridge.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.interlinked.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Interlinked:
    build:
      targets:
        Interlinked: all
        interlinked-ctl: all
        InterlinkedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InterlinkedTests
    archive:
      config: TestFlight

name: Interlinked
configs:
  Debug: debug
  Release: release
  TestFlight: release
options:
  bundleIdPrefix: computer.interlinked
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  xcodeVersion: "16.0"
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Interlinked:
    type: application
    platform: macOS
    category: public.app-category.productivity
    sources:
      - path: Interlinked
    info:
      path: Interlinked/Info.plist
      properties:
        CFBundleDisplayName: Interlinked
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: computer.interlinked.web-url
            CFBundleURLSchemes:
              - http
              - https
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSCameraUsageDescription: Interlinked lets websites use the camera only after you approve their request.
        NSBluetoothAlwaysUsageDescription: Interlinked lets websites use nearby Bluetooth devices only after you approve their request.
        NSHumanReadableCopyright: Copyright © 2026 Jonatas Walker. All rights reserved.
        NSMicrophoneUsageDescription: Interlinked lets websites use the microphone only after you approve their request.
        NSLocationWhenInUseUsageDescription: Interlinked lets websites use your location only after you approve their request.
        InterlinkedJevRelayURL: "$(INTERLINKED_JEV_RELAY_URL)"
        InterlinkedBlockerResourcesURL: "$(INTERLINKED_BLOCKER_RESOURCES_URL)"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: computer.interlinked.tab
            UTTypeDescription: Interlinked tab
            UTTypeConformsTo:
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.interlinked
        PRODUCT_NAME: Interlinked
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 57249C654W
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Interlinked/Info.plist
        CODE_SIGN_ENTITLEMENTS: Interlinked/Interlinked.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/blocker"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/blocker/target/release"
        OTHER_LDFLAGS: "$(inherited) -linterlinked_blocker"
        SWIFT_OBJC_BRIDGING_HEADER: Interlinked/WebKit/Interlinked-Bridging-Header.h
        ENABLE_TESTABILITY: YES
        DEFINES_MODULE: YES
        ENABLE_DEBUG_DYLIB: NO
        INTERLINKED_JEV_RELAY_URL: ""
        # Opt-in HTTPS source for blocker-resources.json; empty keeps the bundled copy.
        INTERLINKED_BLOCKER_RESOURCES_URL: ""
      configs:
        TestFlight:
          CODE_SIGN_ENTITLEMENTS: Interlinked/InterlinkedTestFlight.entitlements
          ENABLE_APP_SANDBOX: YES
          INTERLINKED_JEV_RELAY_URL: "https://interlinked-jev.187-77-224-188.sslip.io/v1/jev"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TESTFLIGHT"
    preBuildScripts:
      - name: Build Content Blocker
        script: '"$SRCROOT/script/build-blocker"'
        basedOnDependencyAnalysis: false
  interlinked-ctl:
    type: tool
    platform: macOS
    sources:
      - path: InterlinkedControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.interlinked.cli
        PRODUCT_NAME: interlinked
        PRODUCT_MODULE_NAME: InterlinkedControl
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_FORCE_DYNAMIC_LINK_STDLIB: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  InterlinkedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: InterlinkedTests
      - path: Interlinked/Model
      - path: Interlinked/App/PageTextBridge.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.interlinked.tests
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: InterlinkedTests
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        TEST_HOST: ""
        BUNDLE_LOADER: ""
  InterlinkedUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: InterlinkedUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.interlinked.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Interlinked
        # The runner is signed with the app's team, so the bundle it loads must be too.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 57249C654W
    dependencies:
      - target: Interlinked
schemes:
  Interlinked:
    build:
      targets:
        Interlinked: all
        interlinked-ctl: all
        InterlinkedTests: [test]
        InterlinkedUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InterlinkedTests
        - InterlinkedUITests
      preActions:
        - name: Start Fixture Server
          script: '"$SRCROOT/script/fixture-server" start'
          settingsTarget: Interlinked
      postActions:
        - name: Stop Fixture Server
          script: '"$SRCROOT/script/fixture-server" stop'
          settingsTarget: Interlinked
    archive:
      config: TestFlight
  InterlinkedTests:
    build:
      targets:
        InterlinkedTests: [test]
    test:
      config: Debug
      targets:
        - InterlinkedTests

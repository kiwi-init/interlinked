[package]
name = "interlinked_blocker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
adblock = { version = "0.13", default-features = false, features = ["css-validation", "embedded-domain-resolver", "full-regex-handling"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
